<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 1 - October Revision</title>
<style>
:root{--navy:#112f4a;--teal:#0d7c7b;--mint:#eaf7f5;--ink:#17212b;--line:#d9e2e7;--wrong:#a92828;--right:#157347}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f7f8;color:var(--ink);line-height:1.5}
header{background:linear-gradient(135deg,var(--navy),#1b5975);color:#fff;padding:32px 18px;text-align:center}header h1{margin:0;font-size:clamp(1.45rem,4vw,2.25rem)}header p{margin:7px 0 0;opacity:.9}
main{max-width:920px;margin:26px auto;padding:0 16px 40px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:0;border-radius:999px;padding:10px 17px;background:#e0e8ed;color:var(--navy);font-weight:700;cursor:pointer}.tab.active{background:var(--teal);color:#fff}.panel{display:none}.panel.active{display:block}.intro,.question{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #0f2c3c08}.intro{background:var(--mint);border-color:#bde5df}.section{color:var(--teal);font-size:1.05rem;font-weight:700;margin:28px 0 9px}.question p{margin:0 0 10px;font-weight:600}.option{display:block;padding:8px 10px;margin:5px 0;border:1px solid #d5dfe3;border-radius:8px;cursor:pointer}.option:hover{background:#f0f8f7}.short{width:100%;min-height:82px;border:1px solid #c9d7dc;border-radius:8px;padding:10px;font:inherit}.submit{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:13px 20px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:14px}.result{display:none;margin-top:18px;padding:16px;border-radius:10px;background:#eaf7ef;color:var(--right);font-weight:700}.feedback{font-size:.92rem;margin:8px 0 0}.right{color:var(--right)}.wrong{color:var(--wrong)}.note{font-size:.9rem;color:#52616b}
</style>
</head>
<body>
<header><h1>October Revision - Unit 1</h1><p>What is Information? | First Secondary - Programming and Artificial Intelligence</p></header>
<main><div class="tabs"><button class="tab active" data-model="1">Model 1</button><button class="tab" data-model="2">Model 2</button><button class="tab" data-model="3">Model 3</button></div><div id="app"></div></main>
<script>
const models = [
{name:'Model 1', q:[
 ['tf','Data are raw facts that can be represented by numbers, letters, or symbols.','True'],['tf','Information disappears completely after it is shared on the Internet.','False'],['tf','A personal experience report is a source of primary information.','True'],['tf','Texts, images, and videos are examples of transmission media.','False'],
 ['mc','Which statement best describes information?',['Raw facts with no meaning','Something that has meaning or value to the recipient','Unintelligible symbols only','A random group of numbers'],1],['mc','Knowledge means:',['Copying information','Analyzing and organizing information to solve problems','Raw data only','Spreading rumors'],1],['mc','Which is a source of secondary information?',['A personal interview with a witness','A student’s own observation','A textbook','An experiment you carried out'],2],['mc','Which of the following is expression media?',['Television broadcast','Radio station','Text and images','Internet cable'],2],['mc','Media culture is the ability to:',['Share every post immediately','Interpret information from media accurately','Create false news','Avoid using any media'],1],['mc','Which action follows information ethics?',['Posting a classmate’s photo without permission','Checking a source before sharing information','Copying an article and claiming it is yours','Using another person’s account'],1],
 ['short','Write the scientific term: Raw facts that have not yet been processed or given meaning.','data'],['short','Write the scientific term: The ability to understand, evaluate, and interpret media messages accurately.','media culture'],['short','Write one difference between data and information.',null]]},
{name:'Model 2',q:[
 ['tf','Information ethics includes respecting copyright and privacy.','True'],['tf','Television and radio are examples of propagation or transmission media.','True'],['tf','It is acceptable to publish copyrighted images without permission.','False'],['tf','Identity theft can include pretending to be another person to access an account.','True'],
 ['mc','Which is an example of transmission media?',['A photograph','A written text','Television and radio','A drawing'],2],['mc','Which action is an infringement of information ethics?',['Respecting privacy','Verifying information sources','Posting copyrighted images without permission','Avoiding cyberbullying'],2],['mc','Identity theft means:',['Sharing a useful video','Impersonating someone to steal accounts or personal information','Using a phone while walking','Writing a newspaper article'],1],['mc','Before sharing a news post, the most responsible action is to:',['Share it quickly','Verify its source and accuracy','Remove the author’s name','Change its meaning'],1],['mc','Which is most likely information rather than data?',['85, 90, 95','A table of unprocessed survey answers','The class average is 90%','A list of student ID numbers'],2],['mc','Which is NOT an example of expression media?',['Text','Image','Video','Radio broadcast station'],3],
 ['short','Write the scientific term: Rules and values that guide responsible use, sharing, and creation of information.','information ethics'],['short','Write the scientific term: Using another person’s identity or personal information without permission.','identity theft'],['short','Why is verifying a source important before sharing information online?',null]]},
{name:'Model 3',q:[
 ['tf','Knowledge can be produced by analyzing information and using it to solve a problem.','True'],['tf','A newspaper is always a primary source of information.','False'],['tf','Respecting privacy is part of information ethics.','True'],['tf','A video is only transmission media and can never express information.','False'],
 ['mc','A weather app says, “It will rain tomorrow, so take an umbrella.” This message is:',['Data','Information','An unintelligible symbol','Identity theft'],1],['mc','Which source is primary information?',['A book that summarizes a historical event','A student’s report about an experiment they performed','An encyclopedia article','A newspaper summary'],1],['mc','Which example shows ethical use of information?',['Sharing a private message without consent','Giving credit to the author of a source','Changing a source to support your opinion','Using someone else’s password'],1],['mc','Which option correctly matches the media type?',['Text - transmission media','Television - expression media','Images - expression media','Radio - raw data'],2],['mc','Which situation is identity theft?',['A student creates a poster','A person uses a friend’s password to enter the friend’s account','A teacher uploads a lesson','A learner watches a video'],1],['mc','When information is analyzed and organized to make a decision, it becomes:',['Knowledge','A symbol','A rumor','Transmission media'],0],
 ['short','Write the scientific term: Processed data that has meaning or value to the person who receives it.','information'],['short','Write the scientific term: Media such as television and radio that carry information from one place to another.','transmission media'],['short','Explain how data, information, and knowledge are connected.',null]]}
];
let current=0;
function render(){const m=models[current];let html=`<section class="intro"><strong>${m.name}</strong><br>Answer all questions, then press <em>Check my answers</em>. Objective questions are scored automatically. Short-answer responses are saved on this page for self-review.</section>`;let n=0;let sec='';m.q.forEach((x,i)=>{let s=x[0]==='tf'?'A. True or False':x[0]==='mc'?'B. Choose the correct answer':'C. Scientific term / short answer';if(s!==sec){sec=s;html+=`<div class="section">${sec}</div>`}n++;html+=`<div class="question" data-i="${i}"><p>${n}. ${x[1]}</p>`;if(x[0]==='tf'){html+=['True','False'].map(a=>`<label class="option"><input type="radio" name="q${i}" value="${a}"> ${a}</label>`).join('')}else if(x[0]==='mc'){html+=x[2].map((a,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${a}</label>`).join('')}else{html+=`<textarea class="short" id="q${i}" placeholder="Write your answer here..."></textarea>`}html+=`<div class="feedback"></div></div>`});html+=`<button class="submit" onclick="check()">Check my answers</button><div class="result" id="result"></div><p class="note">Note: results are shown only in this browser and are not sent anywhere.</p>`;document.getElementById('app').innerHTML=html}
function check(){const m=models[current];let score=0,total=0;m.q.forEach((x,i)=>{const box=document.querySelector(`[data-i="${i}"]`),feed=box.querySelector('.feedback');feed.textContent='';feed.className='feedback';if(x[0]==='short'){if(x[2]){total++;const v=document.getElementById('q'+i).value.trim().toLowerCase();const ok=v.includes(x[2]);if(ok)score++;feed.textContent=ok?'Correct.':'Expected answer: '+x[2];feed.classList.add(ok?'right':'wrong')}return}total++;const chosen=document.querySelector(`input[name="q${i}"]:checked`);const got=chosen?chosen.value:'';const ans=x[0]==='tf'?x[2]:String(x[3]);const ok=got===ans;if(ok)score++;feed.textContent=ok?'Correct.':'Correct answer: '+(x[0]==='tf'?ans:String.fromCharCode(65+Number(ans)));feed.classList.add(ok?'right':'wrong')});const r=document.getElementById('result');r.style.display='block';r.textContent=`Automatic score: ${score} / ${total}. Review the feedback beside each question.`}
document.querySelectorAll('.tab').forEach((b,i)=>b.onclick=()=>{current=i;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});render();
</script></body></html>
